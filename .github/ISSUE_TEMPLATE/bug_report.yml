name: Bug report
description: Report a problem with Metrolist+
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This form is for Metrolist+, the macOS app. Metrolist+ is not affiliated with the Metrolist
        Android app, so please don't report its problems to the Metrolist project.

        Never attach your data folder, which holds your signed-in session and your library.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what the app did and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Play ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - AutoMix and transitions
        - Playback and streaming
        - Bit-perfect output and equaliser
        - Lyrics
        - Music videos
        - Library, downloads and imports
        - Device Connect and shared queue
        - Concerts
        - Interface
        - Something else
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Metrolist+ version
      description: Choose About Metrolist+ in the Metrolist+ menu.
      placeholder: "2.0"
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Where did you get the app?
      options:
        - The release download
        - I built it from source
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 26.1, MacBook Air M3
    validations:
      required: true
  - type: textarea
    id: songs
    attributes:
      label: Songs involved
      description: For an AutoMix problem, give the YouTube Music links of both songs in the order they played.
  - type: textarea
    id: mix-log
    attributes:
      label: AutoMix log
      description: >-
        For an AutoMix problem, paste the lines from that time in
        ~/Library/Application Support/Metrolist/mix.log. The log contains song titles, so remove any
        line you don't want to make public.
      render: text
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Add screenshots, or settings you changed. Remove account details first.
